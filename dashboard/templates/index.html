<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash & Crown | Video Production Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141418;
      --card-border: #27272a;
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --cyan: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --progress-bg: #222228;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1.1rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-crown {
      color: var(--gold);
      font-size: 1.7rem;
    }

    .brand-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background-color: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-live::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .player-header {
      padding: 1.2rem 1.75rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .video-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .video-viewport {
      background: #000;
      aspect-ratio: 16 / 9;
      width: 100%;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .controls-overlay {
      display: flex;
      gap: 1rem;
      padding: 0.85rem 1.75rem;
      background: #111115;
      border-top: 1px solid var(--card-border);
      align-items: center;
    }

    .btn-sm {
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid var(--card-border);
      background: #1c1c22;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sm:hover {
      background: #272730;
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Clean Completion Progress Card */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.75rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .progress-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .progress-label-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .progress-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-status {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--cyan);
    }

    .progress-pct {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold-glow);
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: var(--progress-bg);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #b8860b, var(--gold), var(--cyan));
      border-radius: 9999px;
      transition: width 0.4s ease;
      width: 0%;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .render-stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat-pill strong {
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-crown">👑</span>
      <div>
        <div class="brand-title">CASH & CROWN</div>
        <div style="font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.05em;">AUTOMATED DOCUMENTARY STUDIO</div>
      </div>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <span class="badge-live" id="renderBadge">Ready</span>
      <div style="font-size: 0.8rem; color: var(--text-muted);">Port 5050</div>
    </div>
  </header>

  <main>
    <div class="player-card">
      <div class="player-header">
        <div class="video-title" id="videoHeading">Why Rockstar Made the World Wait 13 Years for GTA VI</div>
        <span style="font-size: 0.8rem; color: var(--gold); font-weight: 700; background: rgba(212, 175, 55, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(212, 175, 55, 0.3);">1080p 60fps</span>
      </div>

      <div class="video-viewport">
        <video id="videoPlayer" controls autoplay muted loop playsinline>
          <source src="/api/video" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>

      <div class="controls-overlay">
        <button class="btn-sm" onclick="reloadVideo()">🔄 Force Reload Video</button>
        <button class="btn-sm" onclick="togglePlay()">⏯ Play / Pause</button>
        <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: auto;">
          ⚡ Clean 4:3 Centered Gameplay Clips & Corner Logos
        </span>
      </div>
    </div>

    <!-- Live Render Completion Card -->
    <div class="progress-card">
      <div class="progress-top-row">
        <div class="progress-label-wrap">
          <span class="progress-title">Render Completion</span>
          <span class="progress-status" id="statusText">Checking Engine Status...</span>
        </div>
        <div class="progress-pct" id="pctText">0%</div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <div class="render-stats-row">
        <div class="stat-pill" id="sceneStats">Scene: <strong>-- / --</strong></div>
        <div class="stat-pill" id="frameStats">Frames: <strong>-- / --</strong></div>
        <div class="stat-pill" id="etaStats">ETA: <strong>--</strong></div>
      </div>
    </div>
  </main>

  <script>
    function reloadVideo() {
      const player = document.getElementById('videoPlayer');
      player.src = '/api/video?t=' + Date.now();
      player.play();
    }

    function togglePlay() {
      const player = document.getElementById('videoPlayer');
      if (player.paused) player.play();
      else player.pause();
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        const pct = data.progress?.percent || (data.video_ready ? 100 : 0);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('pctText').innerText = Math.round(pct) + '%';
        document.getElementById('statusText').innerText = data.progress?.status || (data.video_ready ? 'Video Ready' : 'Idle');

        const badge = document.getElementById('renderBadge');
        if (data.progress?.status && data.progress.status.includes('Render')) {
          badge.innerText = 'Rendering';
          badge.style.color = '#eab308';
          badge.style.borderColor = 'rgba(234, 179, 8, 0.4)';
        } else {
          badge.innerText = 'Ready';
          badge.style.color = 'var(--cyan)';
          badge.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        }

        if (data.progress?.current_scene) {
          document.getElementById('sceneStats').innerHTML = 'Scene: <strong>' + data.progress.current_scene + ' / ' + data.progress.total_scenes + '</strong>';
        }
        if (data.progress?.current_frame) {
          document.getElementById('frameStats').innerHTML = 'Frames: <strong>' + data.progress.current_frame + ' / ' + data.progress.total_frames + '</strong>';
        }
        if (data.progress?.eta_seconds !== undefined) {
          const m = Math.floor(data.progress.eta_seconds / 60);
          const s = Math.round(data.progress.eta_seconds % 60);
          document.getElementById('etaStats').innerHTML = 'ETA: <strong>' + m + 'm ' + s + 's</strong>';
        }
      } catch (e) {
        console.error('Status fetch error', e);
      }
    }

    // Auto-poll status every 2 seconds
    fetchStatus();
    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
